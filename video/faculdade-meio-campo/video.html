<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Meio-Campo · A resenha (animática acadêmica)</title>
<style>
  /* Trabalho acadêmico (Legislação Publicitária): marca FICTÍCIA "Meio-Campo". Animação determinística: renderAt(t). */
  html, body { margin: 0; padding: 0; background: #000; }
  #palco { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; }
  #cena { position: absolute; left: 0; top: 0; width: 1920px; height: 960px; overflow: hidden; }
  #cena svg { display: block; }
  #legenda { position: absolute; left: 0; right: 0; top: 836px; text-align: center; pointer-events: none; }
  #legenda span { display: inline-block; background: rgba(0,0,0,.72); color: #F4F1EA; font-weight: 600; font-size: 40px; padding: 12px 30px; border-radius: 10px; }
  #legenda b { color: #E0B33A; font-weight: 700; }
  /* FAIXA OBRIGATÓRIA: fixa, sólida, sem animação, 120 px (11,1% de 1080), nada por cima */
  #faixa { position: absolute; left: 0; top: 960px; width: 1920px; height: 120px; background: #000000; z-index: 100;
           display: flex; align-items: center; justify-content: center; }
  #faixa .txt { color: #FFFFFF; font-weight: 700; font-size: 44px; letter-spacing: .005em; }
  #faixa .selo { position: absolute; right: 48px; top: 18px; width: 84px; height: 84px; border-radius: 50%; background: #FFFFFF; color: #000000;
                 display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 34px; }
</style></head>
<body>
<div id="palco">
  <div id="cena"></div>
  <div id="legenda"></div>
  <div id="faixa"><div class="txt">Ministério da Fazenda adverte: Apostar faz você perder dinheiro</div><div class="selo">18+</div></div>
</div>
<script>
const VERDE = '#0F3D2E', OFF = '#F4F1EA', MOST = '#E0B33A', CINZA = '#2B2B2B';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (u) => { u = clamp(u); return u * u * (3 - 2 * u); };
const ramp = (t, a, d) => ease((t - a) / d);
const lerp = (a, b, u) => a + (b - a) * u;

// ── personagens adultos (formas geométricas, sem traços infantis) ───────────────────────────────
// p: {x, y (quadril), s, pele, cabelo, barba, camisa, calca, pe (sentado|em pe), bracos ('colo'|'cima'|'abraco'|'ombros'), boca ('fechada'|'sorriso'|'riso'), olhar}
function pessoa(p) {
  const s = p.s || 1, pe = p.pe || 0;            // pe: 0 sentado → 1 em pé
  const torsoH = 170, legH = lerp(70, 190, pe);
  const hipY = p.y - lerp(0, 120, pe);
  const shY = hipY - torsoH, headY = shY - 62;
  const w = 118;
  let g = `<g>`;
  const X = (v) => p.x + v * 1, Y = (v) => v;
  // pernas (calça escura): sentado = coxas curtas para frente + canela; em pé = retas
  const calca = p.calca || '#3a3f45';
  g += `<rect x="${X(-50)}" y="${Y(hipY - 10)}" width="44" height="${legH + 10}" rx="16" fill="${calca}"/>`;
  g += `<rect x="${X(6)}" y="${Y(hipY - 10)}" width="44" height="${legH + 10}" rx="16" fill="${calca}"/>`;
  g += `<rect x="${X(-54)}" y="${Y(hipY + legH - 8)}" width="52" height="18" rx="9" fill="#1e1f22"/><rect x="${X(2)}" y="${Y(hipY + legH - 8)}" width="52" height="18" rx="9" fill="#1e1f22"/>`;
  // braços (atrás do tronco quando para cima/abraço)
  const pele = p.pele, camisa = p.camisa;
  const braco = (lado) => {
    const sx = X(lado * (w / 2 - 6)), sy = Y(shY + 26);
    let ex, ey, hx, hy;
    let b = p.bracos || 'colo';
    if (b === 'abraco' && ((lado < 0 && p.borda === 'esq') || (lado > 0 && p.borda === 'dir'))) b = 'colo';   // braço de fora abaixado
    if (b === 'cima') { ex = sx + lado * 30; ey = sy - 80; hx = sx + lado * 44; hy = sy - 165; }
    else if (b === 'abraco') { ex = sx + lado * 46; ey = sy - 14; hx = sx + lado * 104; hy = sy - 4; }   // braço por cima do ombro do vizinho
    else if (b === 'ombros') { ex = sx + lado * 52; ey = sy + 50; hx = sx + lado * 78; hy = sy + 8; }
    else { ex = sx + lado * 14; ey = sy + 96; hx = sx - lado * 12; hy = sy + 160 - pe * 10; }
    return `<path d="M${sx},${sy} L${ex},${ey} L${hx},${hy}" stroke="${camisa}" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>` +
           `<circle cx="${hx}" cy="${hy}" r="17" fill="${pele}"/>`;
  };
  const tras = p.bracos === 'cima' || p.bracos === 'abraco' || p.bracos === 'ombros';
  if (tras) g += braco(-1) + braco(1);
  // tronco (camisa lisa, ombros retos de adulto)
  g += `<path d="M${X(-w / 2)},${Y(shY + 30)} Q${X(-w / 2)},${Y(shY)} ${X(-w / 2 + 30)},${Y(shY)} L${X(w / 2 - 30)},${Y(shY)} Q${X(w / 2)},${Y(shY)} ${X(w / 2)},${Y(shY + 30)} L${X(w / 2 - 6)},${Y(hipY + 4)} L${X(-w / 2 + 6)},${Y(hipY + 4)} Z" fill="${camisa}"/>`;
  g += `<path d="M${X(-16)},${Y(shY)} L${X(0)},${Y(shY + 22)} L${X(16)},${Y(shY)}" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="5"/>`;
  if (!tras) g += braco(-1) + braco(1);
  // pescoço e cabeça (proporção adulta: cabeça pequena em relação ao tronco)
  const tilt = p.inclina || 0;
  g += `<g transform="rotate(${tilt} ${X(0)} ${Y(shY)})">`;
  g += `<rect x="${X(-15)}" y="${Y(shY - 24)}" width="30" height="30" fill="${pele}"/>`;
  g += `<rect x="${X(-38)}" y="${Y(headY - 46)}" width="76" height="96" rx="34" fill="${pele}"/>`;
  // cabelo curto
  g += `<path d="M${X(-40)},${Y(headY - 8)} Q${X(-42)},${Y(headY - 54)} ${X(0)},${Y(headY - 56)} Q${X(42)},${Y(headY - 54)} ${X(40)},${Y(headY - 8)} L${X(34)},${Y(headY - 26)} Q${X(0)},${Y(headY - 36)} ${X(-34)},${Y(headY - 26)} Z" fill="${p.cabelo}"/>`;
  // barba
  if (p.barba) g += `<path d="M${X(-38)},${Y(headY + 4)} Q${X(-38)},${Y(headY + 56)} ${X(0)},${Y(headY + 58)} Q${X(38)},${Y(headY + 56)} ${X(38)},${Y(headY + 4)} L${X(28)},${Y(headY + 10)} Q${X(0)},${Y(headY + 24)} ${X(-28)},${Y(headY + 10)} Z" fill="${p.cabelo}"/>`;
  // olhos, sobrancelhas, boca
  const ox = p.olhar || 0;
  g += `<rect x="${X(-20 + ox)}" y="${Y(headY - 8)}" width="9" height="${p.boca === 'riso' ? 4 : 9}" rx="3" fill="${CINZA}"/><rect x="${X(11 + ox)}" y="${Y(headY - 8)}" width="9" height="${p.boca === 'riso' ? 4 : 9}" rx="3" fill="${CINZA}"/>`;
  g += `<rect x="${X(-24 + ox)}" y="${Y(headY - 22)}" width="17" height="5" rx="2" fill="${p.cabelo}"/><rect x="${X(7 + ox)}" y="${Y(headY - 22)}" width="17" height="5" rx="2" fill="${p.cabelo}"/>`;
  if (p.boca === 'riso') g += `<path d="M${X(-15 + ox)},${Y(headY + 16)} Q${X(ox)},${Y(headY + 38)} ${X(15 + ox)},${Y(headY + 16)} Z" fill="#5a2a22"/>`;
  else if (p.boca === 'sorriso') g += `<path d="M${X(-13 + ox)},${Y(headY + 18)} Q${X(ox)},${Y(headY + 28)} ${X(13 + ox)},${Y(headY + 18)}" stroke="#5a2a22" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  else g += `<rect x="${X(-10 + ox)}" y="${Y(headY + 19)}" width="20" height="4" rx="2" fill="#5a2a22"/>`;
  g += `</g></g>`;
  return g;
}

// elenco: quatro amigos adultos (30–40 anos); Rafa é o segundo
const AMIGOS = [
  {nome: 'Léo', pele: '#c98f6a', cabelo: '#2a1f1a', barba: true, camisa: '#2f6db5'},
  {nome: 'Rafa', pele: '#e0b08a', cabelo: '#3b2a20', barba: true, camisa: '#2f6db5'},
  {nome: 'Dudu', pele: '#8d5a3c', cabelo: '#1a1410', barba: false, camisa: '#5b6770'},
  {nome: 'Caio', pele: '#d9a37e', cabelo: '#6b5a4a', barba: true, camisa: '#2f6db5'},
];

// ── TV com jogo (times inventados: camisas lisas AZUL e VERDE, sem escudos nem nomes reais) ──────
function tv(x, y, w, h, t, modo) {
  let g = `<rect x="${x - 14}" y="${y - 14}" width="${w + 28}" height="${h + 28}" rx="10" fill="#151515"/>`;
  g += `<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="0 0 640 360">`;
  if (modo === 'placar') {
    g += `<rect width="640" height="360" fill="#14231c"/>`;
    g += `<text x="320" y="88" text-anchor="middle" font-size="30" font-weight="700" fill="${MOST}" letter-spacing="4">FIM DE JOGO</text>`;
    g += `<rect x="20" y="130" width="600" height="120" rx="14" fill="#0b0b0b"/>`;
    g += `<rect x="38" y="160" width="20" height="60" rx="4" fill="#2f6db5"/><rect x="582" y="160" width="20" height="60" rx="4" fill="#3aa060"/>`;
    g += `<text x="320" y="212" text-anchor="middle" font-size="48" font-weight="800" fill="#fff">AZUL 0 x 1 VERDE</text>`;
  } else {
    // campo visto de cima, com listras de grama
    for (let i = 0; i < 8; i++) g += `<rect x="${i * 80}" y="0" width="80" height="360" fill="${i % 2 ? '#2d8a4e' : '#2a7f48'}"/>`;
    g += `<rect x="20" y="20" width="600" height="320" fill="none" stroke="#e8efe8" stroke-width="3"/><line x1="320" y1="20" x2="320" y2="340" stroke="#e8efe8" stroke-width="3"/><circle cx="320" cy="180" r="48" fill="none" stroke="#e8efe8" stroke-width="3"/>`;
    g += `<rect x="560" y="110" width="60" height="140" fill="none" stroke="#e8efe8" stroke-width="3"/><rect x="616" y="150" width="14" height="60" fill="none" stroke="#fff" stroke-width="3"/>`;
    // jogadores (círculos de cor lisa) e bola
    const lance = modo === 'lance' ? clamp((t - 9.3) / 2.2) : 0;
    const azuis = [[200, 120], [260, 240], [330, 170], [420, 110], [440, 260]].map(([a, b], i) => [a + lance * (120 + i * 10) + Math.sin(t * 2 + i) * 6, b + Math.cos(t * 1.7 + i) * 5]);
    const verdes = [[480, 150], [510, 230], [560, 180], [380, 210], [600, 182]].map(([a, b], i) => [a + Math.sin(t * 1.5 + i) * 6 + lance * 20, b + Math.cos(t * 2 + i) * 5]);
    azuis.forEach(([a, b]) => g += `<circle cx="${a}" cy="${b}" r="11" fill="#2f6db5" stroke="#fff" stroke-width="2"/>`);
    verdes.forEach(([a, b]) => g += `<circle cx="${a}" cy="${b}" r="11" fill="#3aa060" stroke="#fff" stroke-width="2"/>`);
    let bx = 330 + Math.sin(t * 1.2) * 40, by = 170 + Math.cos(t) * 20;
    if (modo === 'lance') {
      const u = clamp((t - 9.3) / 2.2), v = clamp((t - 11.5) / .5);
      bx = lerp(330, 560, ease(u)); by = lerp(170, 170, u);
      if (t >= 11.5) { bx = lerp(560, 650, v); by = lerp(170, 92, v); }       // chute passa por cima/fora
    }
    g += `<circle cx="${bx}" cy="${by}" r="8" fill="#fff" stroke="#222" stroke-width="2"/>`;
    g += `<rect x="14" y="10" width="180" height="40" rx="6" fill="rgba(0,0,0,.6)"/><text x="104" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">AZU 0 x 0 VER</text>`;
    if (modo === 'lance' && t > 12.0 && t < 14.5) g += `<rect x="220" y="290" width="200" height="44" rx="8" fill="rgba(0,0,0,.65)"/><text x="320" y="320" text-anchor="middle" font-size="24" font-weight="700" fill="${MOST}">PRA FORA!</text>`;
  }
  g += `</svg>`;
  // brilho da TV na sala
  return g;
}

// ── sala ─────────────────────────────────────────────────────────────────────────────────────────
function sala(t, est) {
  let g = `<defs><radialGradient id="abajur" cx="0.88" cy="0.3" r="0.55"><stop offset="0" stop-color="#f2b66a" stop-opacity=".55"/><stop offset="1" stop-color="#f2b66a" stop-opacity="0"/></radialGradient>
    <linearGradient id="parede" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a22"/><stop offset="1" stop-color="#2c211b"/></linearGradient></defs>`;
  g += `<rect width="1920" height="960" fill="url(#parede)"/>`;
  g += `<rect x="0" y="720" width="1920" height="240" fill="#1f1713"/>`;                            // piso
  g += `<rect width="1920" height="960" fill="url(#abajur)"/>`;
  // janela noturna e abajur
  g += `<rect x="1290" y="90" width="260" height="230" rx="6" fill="#16222e"/><line x1="1420" y1="90" x2="1420" y2="320" stroke="#2c211b" stroke-width="10"/><circle cx="1500" cy="150" r="18" fill="#d9d4c4" opacity=".8"/>`;
  g += `<rect x="1740" y="230" width="16" height="420" fill="#5a4636"/><path d="M1690,240 L1806,240 L1780,160 L1716,160 Z" fill="${MOST}"/>`;
  // TV na parede esquerda (rack)
  g += `<rect x="90" y="560" width="660" height="40" rx="6" fill="#4a3a2e"/>`;
  g += tv(110, 170, 620, 349, t, est.tv);
  g += `<rect x="90" y="530" width="660" height="10" fill="rgba(140,200,160,.12)"/>`;
  // sofá
  g += `<rect x="860" y="470" width="900" height="120" rx="40" fill="#5b4a3d"/>`;
  g += `<rect x="830" y="560" width="960" height="140" rx="30" fill="#6b584a"/>`;
  g += `<rect x="810" y="520" width="80" height="190" rx="30" fill="#5b4a3d"/><rect x="1730" y="520" width="80" height="190" rx="30" fill="#5b4a3d"/>`;
  // amigos
  const xs = [990, 1180, 1370, 1560];
  AMIGOS.forEach((a, i) => {
    const o = est.pessoa(i, a);
    g += pessoa({...a, x: xs[i] + (o.dx || 0), y: 640, ...o});
  });
  // mesa de centro: pipoca e refrigerante (sem álcool)
  g += `<rect x="900" y="740" width="760" height="30" rx="10" fill="#7a5a40"/><rect x="930" y="770" width="20" height="120" fill="#5a4030"/><rect x="1610" y="770" width="20" height="120" fill="#5a4030"/>`;
  g += `<path d="M1010,742 L1130,742 L1115,690 L1025,690 Z" fill="#c0392b"/><rect x="1032" y="690" width="10" height="52" fill="#fff" opacity=".9"/><rect x="1064" y="690" width="10" height="52" fill="#fff" opacity=".9"/><rect x="1096" y="690" width="10" height="52" fill="#fff" opacity=".9"/>`;
  for (let k = 0; k < 14; k++) g += `<circle cx="${1030 + (k * 37) % 84}" cy="${680 - (k % 3) * 9}" r="11" fill="#f6edd2"/>`;
  [1220, 1310, 1400, 1490].forEach((cx, k) => {
    g += `<path d="M${cx - 24},${742} L${cx + 24},${742} L${cx + 30},${672} L${cx - 30},${672} Z" fill="rgba(230,240,245,.55)" stroke="#e8eef0" stroke-width="3"/>`;
    g += `<path d="M${cx - 26},${690} L${cx + 26},${690} L${cx + 23},${740} L${cx - 23},${740} Z" fill="#7a2e1e" opacity=".85"/>`;     // refrigerante de cola
    g += `<rect x="${cx + 8}" y="${640}" width="6" height="60" rx="3" fill="${k % 2 ? MOST : '#e85d5d'}" transform="rotate(10 ${cx + 11} 700)"/>`;   // canudo
  });
  if (est.celularNaMesa) g += `<rect x="1520" y="724" width="96" height="18" rx="6" fill="#1b1b1b"/><rect x="1530" y="727" width="76" height="4" rx="2" fill="#3a3a3a"/>`;   // celular virado para baixo
  return g;
}

// ── close do celular (scene 2) ───────────────────────────────────────────────────────────────────
function closeCelular(t) {
  let g = `<rect width="1920" height="960" fill="#2c211b"/><rect width="1920" height="960" fill="url(#luzmesa)"/>`;
  g = `<defs><radialGradient id="luzmesa" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#f2b66a" stop-opacity=".35"/><stop offset="1" stop-color="#f2b66a" stop-opacity="0"/></radialGradient></defs>` + g;
  g += `<rect x="0" y="560" width="1920" height="400" fill="#7a5a40"/><rect x="0" y="560" width="1920" height="14" fill="#8c6a4e"/>`;
  g += `<circle cx="380" cy="600" r="150" fill="#c0392b" opacity=".9"/>`;     // borda do balde de pipoca
  for (let k = 0; k < 16; k++) g += `<circle cx="${300 + (k * 53) % 170}" cy="${520 + (k % 4) * 18}" r="22" fill="#f6edd2"/>`;
  g += `<path d="M1560,520 L1660,520 L1672,700 L1548,700 Z" fill="rgba(230,240,245,.5)" stroke="#e8eef0" stroke-width="4"/><path d="M1554,580 L1666,580 L1670,698 L1550,698 Z" fill="#7a2e1e" opacity=".85"/>`;
  // virar: 7.0–7.7 o celular gira e pousa de tela para baixo na mesa
  const vira = ramp(t, 7.0, .7);
  const cx = 960, cy = lerp(440, 640, vira);
  const sx = Math.cos(vira * Math.PI);            // escala horizontal (vira de lado)
  const ang = lerp(-6, 0, vira);
  // mão e manga (camisa azul lisa)
  const maoY = lerp(0, 120, vira);
  g += `<g transform="translate(0 ${maoY})"><path d="M1260,960 L1180,700 L1290,640 L1420,960 Z" fill="#2f6db5"/></g>`;
  g += `<g transform="translate(${cx} ${cy}) rotate(${ang}) scale(${Math.abs(sx) < .02 ? .02 : sx} 1)">`;
  if (sx > 0) {
    g += `<rect x="-150" y="-290" width="300" height="580" rx="38" fill="#111"/><rect x="-136" y="-272" width="272" height="544" rx="28" fill="${OFF}"/>`;
    g += `<rect x="-136" y="-272" width="272" height="86" rx="28" fill="${VERDE}"/><rect x="-136" y="-216" width="272" height="30" fill="${VERDE}"/>`;
    g += `<line x1="0" y1="-262" x2="0" y2="-196" stroke="${MOST}" stroke-width="3"/><circle cx="0" cy="-229" r="18" fill="none" stroke="${MOST}" stroke-width="3"/>`;
    g += `<text x="0" y="-150" text-anchor="middle" font-size="26" font-weight="800" fill="${VERDE}">Meio-Campo</text>`;
    g += `<circle cx="0" cy="-30" r="56" fill="${VERDE}"/><path d="M-26,-30 L-6,-10 L28,-50" stroke="${MOST}" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    g += `<text x="0" y="68" text-anchor="middle" font-size="25" font-weight="700" fill="${CINZA}">Seu limite mensal</text><text x="0" y="102" text-anchor="middle" font-size="25" font-weight="700" fill="${CINZA}">está ativo ✓</text>`;
  } else {
    g += `<rect x="-150" y="-290" width="300" height="580" rx="38" fill="#1b1b1b"/><rect x="-100" y="-250" width="60" height="60" rx="16" fill="#2a2a2a"/>`;
  }
  g += `</g>`;
  // polegar da mão por cima da borda do celular (antes de virar)
  g += `<g transform="translate(0 ${maoY})" opacity="${1 - vira}"><rect x="1080" y="560" width="70" height="150" rx="35" fill="#e0b08a" transform="rotate(-20 1115 635)"/></g>`;
  return g;
}

// ── tela final ───────────────────────────────────────────────────────────────────────────────────
function telaFinal(t) {
  const a = ramp(t, 23.15, .5), b = ramp(t, 23.9, .5);
  let g = `<rect width="1920" height="960" fill="${VERDE}"/>`;
  // elemento: linha de meio de campo + círculo central, em traço off-white discreto
  g += `<g opacity="${.14 * a}"><line x1="960" y1="0" x2="960" y2="800" stroke="${OFF}" stroke-width="4"/><circle cx="960" cy="360" r="300" fill="none" stroke="${OFF}" stroke-width="4"/></g>`;
  // logo tipográfico: "Meio" | "Campo" separados pela linha de meio de campo, com o círculo central em mostarda
  g += `<g opacity="${a}" transform="translate(0 ${(1 - a) * 20})">`;
  g += `<text x="930" y="360" text-anchor="end" font-size="128" font-weight="800" fill="${OFF}" letter-spacing="-2">Meio</text>`;
  g += `<text x="990" y="360" text-anchor="start" font-size="128" font-weight="800" fill="${OFF}" letter-spacing="-2">Campo</text>`;
  g += `<line x1="960" y1="240" x2="960" y2="390" stroke="${MOST}" stroke-width="8" stroke-linecap="round"/><circle cx="960" cy="315" r="22" fill="none" stroke="${MOST}" stroke-width="7"/>`;
  g += `</g>`;
  g += `<text x="960" y="500" text-anchor="middle" font-size="54" font-weight="600" fill="${MOST}" opacity="${b}">O jogo é melhor com limite.</text>`;
  // texto legal (≥ 4 s na tela: 24,6 s → 30 s), legível, acima da faixa
  const c = ramp(t, 24.6, .3);
  g += `<g opacity="${c}"><text x="960" y="880" text-anchor="middle" font-size="25" font-weight="500" fill="${OFF}">Meio-Campo Entretenimento Ltda. (fictícia) – CNPJ 00.000.000/0001-00 – Autorização SPA/MF nº 000/2026 (fictícia).</text>
    <text x="960" y="920" text-anchor="middle" font-size="25" font-weight="600" fill="${OFF}">Proibido para menores de 18 anos. Jogue com responsabilidade.</text></g>`;
  return g;
}

// ── roteiro por tempo ────────────────────────────────────────────────────────────────────────────
const LEGENDAS = [
  [16.8, 19.7, '<b>Rafa:</b> “Errei o palpite. Mas a resenha valeu.”'],
  [19.9, 22.8, '<b>Caio:</b> “Semana que vem é aqui em casa!”'],
  [23.9, 27.6, '<b>Locução:</b> “Meio-Campo. O jogo é melhor com limite.”'],
];

function quadro(t) {
  let svg = '', zoom = 1, ox = 960, oy = 480;
  if (t < 4) {
    zoom = lerp(1, 1.08, ease(t / 4)); ox = 1100; oy = 520;
    svg = sala(t, {tv: 'jogo', pessoa: (i) => ({boca: i === 1 ? 'sorriso' : 'fechada', olhar: -6, inclina: -3})});
  } else if (t < 9) {
    svg = closeCelular(t);
  } else if (t < 16) {
    const sobe = ramp(t, 11.6, .6), abraca = ramp(t, 12.6, .3);
    zoom = lerp(1.0, 1.05, ease((t - 9) / 7)); ox = 1000; oy = 520;
    svg = sala(t, {tv: 'lance', celularNaMesa: true, pessoa: (i) => ({
      pe: sobe, bracos: t < 11.6 ? 'colo' : t < 12.6 ? 'cima' : 'abraco',
      boca: t < 11.4 ? 'fechada' : 'riso', olhar: t < 12.6 ? -6 : (i % 2 ? -4 : 4), inclina: t < 12.6 ? -3 : (i % 2 ? 5 : -5),
      dx: abraca * [60, 20, -20, -60][i], borda: i === 0 ? 'esq' : i === 3 ? 'dir' : ''})});
  } else if (t < 23) {
    zoom = lerp(1.05, 1.1, ease((t - 16) / 7)); ox = 900; oy = 470;
    svg = sala(t, {tv: 'placar', celularNaMesa: true, pessoa: (i) => {
      if (i === 1) { const d = ramp(t, 16.6, .4) - ramp(t, 18.2, .4); return {pe: 1, bracos: d > .5 ? 'ombros' : 'colo', boca: 'sorriso', olhar: 4, inclina: d > .5 ? 4 : 0}; }
      return {pe: 1, bracos: 'colo', boca: (i === 3 && t > 19.9 && t < 22.8) ? 'riso' : 'sorriso', olhar: i < 1 ? 6 : -6};
    }});
  } else {
    svg = telaFinal(t);
  }
  // transições discretas (fades de 0,3 s nas trocas de cena)
  let fade = 0;
  for (const c of [4, 9, 16, 23]) { const d = Math.abs(t - c); if (d < .3) fade = Math.max(fade, 1 - d / .3); }
  const tr = zoom !== 1 ? `transform="translate(${ox} ${oy}) scale(${zoom}) translate(${-ox} ${-oy})"` : '';
  document.getElementById('cena').innerHTML = `<svg width="1920" height="960" viewBox="0 0 1920 960" font-family="Inter, Helvetica Neue, Arial, sans-serif"><g ${tr}>${svg}</g>` +
    `<rect width="1920" height="960" fill="#000" opacity="${fade * .9}"/></svg>`;
  const L = LEGENDAS.find(([a, b]) => t >= a && t < b);
  document.getElementById('legenda').innerHTML = L ? `<span>${L[2]}</span>` : '';
  document.getElementById('legenda').style.top = t >= 23 ? '600px' : '836px';
}
window.renderAt = quadro;
document.fonts.ready.then(() => { quadro(0); window.__ready = true; });
</script>
</body></html>
